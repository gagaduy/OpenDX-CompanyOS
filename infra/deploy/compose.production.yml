name: opendx-companyos-production

x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-tiny-deploy: &tiny-deploy
  resources:
    limits:
      cpus: "0.50"
      memory: 256M

x-small-deploy: &small-deploy
  resources:
    limits:
      cpus: "1.00"
      memory: 512M

x-medium-deploy: &medium-deploy
  resources:
    limits:
      cpus: "2.00"
      memory: 1G

x-large-deploy: &large-deploy
  resources:
    limits:
      cpus: "2.00"
      memory: 2G

x-api-environment: &api-environment
  OPENDX_ENV: production
  API_PORT: "4000"
  LOG_FORMAT: json
  LOG_LEVEL: ${LOG_LEVEL:-info}
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  METRICS_PATH: ${METRICS_PATH:-/metrics}
  READINESS_TIMEOUT_MS: ${READINESS_TIMEOUT_MS:-2000}
  JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}
  DATABASE_URL: postgres://opendx:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/opendx
  AGENTIC_ANALYTICS_DATABASE_URL: postgres://opendx_agentic_reader:${POSTGRES_AGENTIC_READER_PASSWORD:?POSTGRES_AGENTIC_READER_PASSWORD is required}@postgres:5432/opendx
  CONSOLE_ORIGIN: ${CONSOLE_ORIGIN:-https://console.example.com}
  STOREFRONT_ORIGIN: ${STOREFRONT_ORIGIN:-https://shop.example.com}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
  CUSTOMER_COOKIE_NAME: ${CUSTOMER_COOKIE_NAME:-opendx_customer}
  GUEST_COOKIE_NAME: ${GUEST_COOKIE_NAME:-opendx_guest}
  CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-opendx_csrf}
  COOKIE_SECURE: "true"
  CUSTOMER_SESSION_TTL_SECONDS: "2592000"
  GUEST_SESSION_TTL_SECONDS: "604800"
  AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-20}
  KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://auth.example.com/realms/opendx}
  KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/opendx/protocol/openid-connect/certs}
  KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-opendx-api}
  KEYCLOAK_TOKEN_URL: ${KEYCLOAK_TOKEN_URL:-http://keycloak:8080/realms/opendx/protocol/openid-connect/token}
  AGENTIC_CONTROL_CLIENT_ID: ${AGENTIC_CONTROL_CLIENT_ID:-opendx-agentic-control}
  AGENTIC_CONTROL_CLIENT_SECRET: ${AGENTIC_CONTROL_CLIENT_SECRET:?AGENTIC_CONTROL_CLIENT_SECRET is required}
  AGENTIC_CONTROL_AUDIENCE: ${AGENTIC_CONTROL_AUDIENCE:-opendx-ai-runtime}
  AI_RUNTIME_INTERNAL_URL: http://ai-runtime:8000
  AGENTIC_EXECUTION_ENABLED: ${AGENTIC_EXECUTION_ENABLED:-true}
  WORKFLOW_GATEWAY_TIMEOUT_MS: ${WORKFLOW_GATEWAY_TIMEOUT_MS:-5000}
  WORKFLOW_DISPATCHER_INTERVAL_MS: ${WORKFLOW_DISPATCHER_INTERVAL_MS:-5000}
  WORKFLOW_DISPATCHER_BATCH_SIZE: ${WORKFLOW_DISPATCHER_BATCH_SIZE:-20}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-opendx_minio}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  MINIO_BUCKET: ${MINIO_BUCKET:-product-media}
  MINIO_SUPPORT_BUCKET: ${MINIO_SUPPORT_BUCKET:-support-attachments}
  MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-10485760}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-30}
  SUPPORT_ATTACHMENT_SCAN_INTERVAL_SECONDS: ${SUPPORT_ATTACHMENT_SCAN_INTERVAL_SECONDS:-30}
  SUPPORT_ESCALATION_INTERVAL_SECONDS: ${SUPPORT_ESCALATION_INTERVAL_SECONDS:-30}
  SUPPORT_ATTACHMENT_RETENTION_INTERVAL_SECONDS: ${SUPPORT_ATTACHMENT_RETENTION_INTERVAL_SECONDS:-3600}
  INVENTORY_RESERVATION_TTL_SECONDS: "900"
  INVENTORY_EXPIRY_INTERVAL_SECONDS: ${INVENTORY_EXPIRY_INTERVAL_SECONDS:-30}
  CHECKOUT_TTL_SECONDS: "900"
  CHECKOUT_EXPIRY_INTERVAL_SECONDS: ${CHECKOUT_EXPIRY_INTERVAL_SECONDS:-30}
  SEPAY_ENVIRONMENT: production
  SEPAY_CHECKOUT_URL: ${SEPAY_CHECKOUT_URL:-https://pay.sepay.vn/v1/checkout/init}
  SEPAY_API_BASE_URL: ${SEPAY_API_BASE_URL:-https://pgapi.sepay.vn}
  SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID:?SEPAY_MERCHANT_ID is required}
  SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY:?SEPAY_SECRET_KEY is required}
  SEPAY_IPN_SECRET: ${SEPAY_IPN_SECRET:?SEPAY_IPN_SECRET is required}
  SEPAY_SUCCESS_URL: ${SEPAY_SUCCESS_URL:-https://shop.example.com/payment/return?outcome=success}
  SEPAY_ERROR_URL: ${SEPAY_ERROR_URL:-https://shop.example.com/payment/return?outcome=error}
  SEPAY_CANCEL_URL: ${SEPAY_CANCEL_URL:-https://shop.example.com/payment/return?outcome=cancel}
  SEPAY_REQUEST_TIMEOUT_MS: ${SEPAY_REQUEST_TIMEOUT_MS:-5000}
  PAYMENT_RECONCILIATION_INTERVAL_SECONDS: ${PAYMENT_RECONCILIATION_INTERVAL_SECONDS:-60}
  PRODUCTION_SEPAY_ACCEPTANCE_AMOUNT_VND: ${PRODUCTION_SEPAY_ACCEPTANCE_AMOUNT_VND:-10000}
  PRODUCTION_SEPAY_ACCEPTANCE_CONFIRMATION: ${PRODUCTION_SEPAY_ACCEPTANCE_CONFIRMATION:-}

x-ai-environment: &ai-environment
  APP_ENV: production
  AI_RUNTIME_HOST: 0.0.0.0
  AI_RUNTIME_PORT: "8000"
  KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://auth.example.com/realms/opendx}
  KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/opendx/protocol/openid-connect/certs}
  KEYCLOAK_TOKEN_URL: ${KEYCLOAK_TOKEN_URL:-http://keycloak:8080/realms/opendx/protocol/openid-connect/token}
  AGENTIC_CONTROL_AUDIENCE: ${AGENTIC_CONTROL_AUDIENCE:-opendx-ai-runtime}
  AGENTIC_CONTROL_CLIENT_ID: ${AGENTIC_CONTROL_CLIENT_ID:-opendx-agentic-control}
  AGENTIC_WORKER_AUDIENCE: ${AGENTIC_WORKER_AUDIENCE:-opendx-api}
  AGENTIC_WORKER_CLIENT_ID: ${AGENTIC_WORKER_CLIENT_ID:-opendx-agentic-worker}
  AGENTIC_WORKER_CLIENT_SECRET: ${AGENTIC_WORKER_CLIENT_SECRET:?AGENTIC_WORKER_CLIENT_SECRET is required}
  AGENTIC_API_BASE_URL: http://api:4000/v1/internal/agentic
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: opendx
  TEMPORAL_TASK_QUEUE: store-health-v1
  TEMPORAL_TLS_ENABLED: "true"
  TEMPORAL_TLS_CA_PATH: /run/temporal-tls/ca.pem
  TEMPORAL_TLS_CERT_PATH: /run/temporal-tls/client.pem
  TEMPORAL_TLS_KEY_PATH: /run/temporal-tls/client-key.pem
  TEMPORAL_TLS_SERVER_NAME: ${TEMPORAL_TLS_SERVER_NAME:-temporal.internal}
  ACTIVITY_START_TO_CLOSE_SECONDS: "30"
  ACTIVITY_SCHEDULE_TO_CLOSE_SECONDS: "180"
  FAKE_ACTIVITY_DELAY_MS: "0"
  WORKER_SHUTDOWN_GRACE_SECONDS: "30"
  COMMAND_RETRY_INTERVAL_SECONDS: "5"
  OPENROUTER_EXECUTION_ENABLED: ${OPENROUTER_EXECUTION_ENABLED:-false}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  WORKER_READINESS_PATH: /tmp/opendx-worker-ready

x-client-tls-volumes: &client-tls-volumes
  - ${TEMPORAL_TLS_CLIENT_DIR:?TEMPORAL_TLS_CLIENT_DIR is required}:/run/temporal-tls:ro

services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      STOREFRONT_HOST: ${STOREFRONT_HOST:-shop.example.com}
      CONSOLE_HOST: ${CONSOLE_HOST:-console.example.com}
      API_HOST: ${API_HOST:-api.example.com}
      KEYCLOAK_HOST: ${KEYCLOAK_HOST:-auth.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, app]
    depends_on:
      api: { condition: service_healthy }
      console: { condition: service_healthy }
      storefront: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    deploy: *small-deploy
    logging: *bounded-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: opendx_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
    volumes: [opendx_postgres:/var/lib/postgresql]
    networks: [data]
    restart: unless-stopped
    stop_grace_period: 60s
    deploy: *large-deploy
    logging: *bounded-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U opendx_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres-role-init:
    image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    environment:
      POSTGRES_ADMIN_USER: opendx_admin
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_APP_USER: opendx
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_APP_DATABASE: opendx
      POSTGRES_AGENTIC_READER_USER: opendx_agentic_reader
      POSTGRES_AGENTIC_READER_PASSWORD: ${POSTGRES_AGENTIC_READER_PASSWORD:?POSTGRES_AGENTIC_READER_PASSWORD is required}
    volumes: [../temporal/scripts/prepare-postgres-roles.sh:/opt/opendx/prepare-postgres-roles.sh:ro]
    entrypoint: ["/bin/sh", "/opt/opendx/prepare-postgres-roles.sh"]
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
    user: postgres
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    deploy: *tiny-deploy
    logging: *bounded-logging

  temporal-db-init:
    image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
    environment:
      POSTGRES_ADMIN_USER: opendx_admin
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_APP_USER: opendx
      TEMPORAL_DB_USER: temporal
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?TEMPORAL_DB_PASSWORD is required}
    volumes: [../temporal/scripts/create-databases.sh:/opt/opendx/create-databases.sh:ro]
    entrypoint: ["/bin/sh", "/opt/opendx/create-databases.sh"]
    networks: [data]
    depends_on:
      postgres-role-init: { condition: service_completed_successfully }
    user: postgres
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    deploy: *tiny-deploy
    logging: *bounded-logging

  temporal-schema:
    image: temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    environment:
      TEMPORAL_DB_USER: temporal
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?TEMPORAL_DB_PASSWORD is required}
    volumes: [../temporal/scripts/setup-schema.sh:/opt/opendx/setup-schema.sh:ro]
    entrypoint: ["/bin/sh", "/opt/opendx/setup-schema.sh"]
    networks: [data]
    depends_on:
      temporal-db-init: { condition: service_completed_successfully }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    deploy: *small-deploy
    logging: *bounded-logging

  temporal:
    image: temporalio/server:1.31.2@sha256:b5ecdb8282bededae2a10c36e8d862e27d0bc2d247fc73c5416025997ab4a1da
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?TEMPORAL_DB_PASSWORD is required}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/production-sql.yaml
      TEMPORAL_ALLOW_NO_AUTH: "true"
      TEMPORAL_TLS_SERVER_CERT: /run/temporal-tls/server.pem
      TEMPORAL_TLS_SERVER_KEY: /run/temporal-tls/server-key.pem
      TEMPORAL_TLS_SERVER_CA_CERT: /run/temporal-tls/ca.pem
      TEMPORAL_TLS_FRONTEND_CERT: /run/temporal-tls/server.pem
      TEMPORAL_TLS_FRONTEND_KEY: /run/temporal-tls/server-key.pem
      TEMPORAL_TLS_CLIENT1_CA_CERT: /run/temporal-tls/ca.pem
      TEMPORAL_TLS_REQUIRE_CLIENT_AUTH: "true"
      TEMPORAL_TLS_FRONTEND_SERVER_NAME: ${TEMPORAL_TLS_SERVER_NAME:-temporal.internal}
      TEMPORAL_TLS_INTERNODE_SERVER_NAME: ${TEMPORAL_TLS_SERVER_NAME:-temporal.internal}
      TEMPORAL_TLS_REFRESH_INTERVAL: 1m
    expose: ["7233"]
    volumes:
      - ../temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
      - ${TEMPORAL_TLS_SERVER_DIR:?TEMPORAL_TLS_SERVER_DIR is required}:/run/temporal-tls:ro
    networks:
      data: {}
      workflow:
        aliases: [temporal.internal]
    group_add: ["${TEMPORAL_TLS_GROUP_ID:-20000}"]
    depends_on:
      temporal-schema: { condition: service_completed_successfully }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 60s
    deploy: *large-deploy
    logging: *bounded-logging
    healthcheck:
      test: ["CMD-SHELL", "for ip in $$(hostname -i); do nc -z \"$$ip\" 7233 && exit 0; done; exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30

  temporal-namespace:
    image: temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: opendx
      TEMPORAL_TLS_ENABLED: "true"
      TEMPORAL_TLS_CA_PATH: /run/temporal-tls/ca.pem
      TEMPORAL_TLS_CERT_PATH: /run/temporal-tls/client.pem
      TEMPORAL_TLS_KEY_PATH: /run/temporal-tls/client-key.pem
      TEMPORAL_TLS_SERVER_NAME: ${TEMPORAL_TLS_SERVER_NAME:-temporal.internal}
    volumes:
      - ../temporal/scripts/register-namespace.sh:/opt/opendx/register-namespace.sh:ro
      - ${TEMPORAL_TLS_CLIENT_DIR:?TEMPORAL_TLS_CLIENT_DIR is required}:/run/temporal-tls:ro
    entrypoint: ["/bin/sh", "/opt/opendx/register-namespace.sh"]
    networks: [workflow]
    group_add: ["${TEMPORAL_TLS_GROUP_ID:-20000}"]
    depends_on:
      temporal: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    deploy: *tiny-deploy
    logging: *bounded-logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2@sha256:3617b09bb4b7510a8d8d9b9fc5707399e2d70688dbcc2f8fb013a144829be1b9
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-opendx_admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-https://auth.example.com}
      CONSOLE_ORIGIN: ${CONSOLE_ORIGIN:-https://console.example.com}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      AGENTIC_CONTROL_CLIENT_SECRET: ${AGENTIC_CONTROL_CLIENT_SECRET:?AGENTIC_CONTROL_CLIENT_SECRET is required}
      AGENTIC_WORKER_CLIENT_SECRET: ${AGENTIC_WORKER_CLIENT_SECRET:?AGENTIC_WORKER_CLIENT_SECRET is required}
      AGENT_AI_CEO_CLIENT_SECRET: ${AGENT_AI_CEO_CLIENT_SECRET:?AGENT_AI_CEO_CLIENT_SECRET is required}
      AGENT_CATALOG_CLIENT_SECRET: ${AGENT_CATALOG_CLIENT_SECRET:?AGENT_CATALOG_CLIENT_SECRET is required}
      AGENT_INVENTORY_CLIENT_SECRET: ${AGENT_INVENTORY_CLIENT_SECRET:?AGENT_INVENTORY_CLIENT_SECRET is required}
      AGENT_ORDER_CLIENT_SECRET: ${AGENT_ORDER_CLIENT_SECRET:?AGENT_ORDER_CLIENT_SECRET is required}
      AGENT_FINANCE_CLIENT_SECRET: ${AGENT_FINANCE_CLIENT_SECRET:?AGENT_FINANCE_CLIENT_SECRET is required}
      AGENT_CRM_CLIENT_SECRET: ${AGENT_CRM_CLIENT_SECRET:?AGENT_CRM_CLIENT_SECRET is required}
      AGENT_SUPPORT_CLIENT_SECRET: ${AGENT_SUPPORT_CLIENT_SECRET:?AGENT_SUPPORT_CLIENT_SECRET is required}
      AGENT_MARKETING_CONTENT_CLIENT_SECRET: ${AGENT_MARKETING_CONTENT_CLIENT_SECRET:?AGENT_MARKETING_CONTENT_CLIENT_SECRET is required}
      AGENT_MARKETING_VISUAL_CLIENT_SECRET: ${AGENT_MARKETING_VISUAL_CLIENT_SECRET:?AGENT_MARKETING_VISUAL_CLIENT_SECRET is required}
      AGENT_MARKETING_PUBLISHER_CLIENT_SECRET: ${AGENT_MARKETING_PUBLISHER_CLIENT_SECRET:?AGENT_MARKETING_PUBLISHER_CLIENT_SECRET is required}
    volumes:
      - ../keycloak/realm-production.json:/opt/keycloak/data/import/opendx-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    networks: [app, egress]
    restart: unless-stopped
    stop_grace_period: 60s
    deploy: *large-deploy
    logging: *bounded-logging
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      retries: 30

  keycloak-reconcile:
    image: quay.io/keycloak/keycloak:26.4.2@sha256:3617b09bb4b7510a8d8d9b9fc5707399e2d70688dbcc2f8fb013a144829be1b9
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: opendx
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-opendx_admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      CONSOLE_ORIGIN: ${CONSOLE_ORIGIN:-https://console.example.com}
      AGENTIC_CONTROL_CLIENT_SECRET: ${AGENTIC_CONTROL_CLIENT_SECRET:?AGENTIC_CONTROL_CLIENT_SECRET is required}
      AGENTIC_WORKER_CLIENT_SECRET: ${AGENTIC_WORKER_CLIENT_SECRET:?AGENTIC_WORKER_CLIENT_SECRET is required}
      AGENT_AI_CEO_CLIENT_SECRET: ${AGENT_AI_CEO_CLIENT_SECRET:?AGENT_AI_CEO_CLIENT_SECRET is required}
      AGENT_CATALOG_CLIENT_SECRET: ${AGENT_CATALOG_CLIENT_SECRET:?AGENT_CATALOG_CLIENT_SECRET is required}
      AGENT_INVENTORY_CLIENT_SECRET: ${AGENT_INVENTORY_CLIENT_SECRET:?AGENT_INVENTORY_CLIENT_SECRET is required}
      AGENT_ORDER_CLIENT_SECRET: ${AGENT_ORDER_CLIENT_SECRET:?AGENT_ORDER_CLIENT_SECRET is required}
      AGENT_FINANCE_CLIENT_SECRET: ${AGENT_FINANCE_CLIENT_SECRET:?AGENT_FINANCE_CLIENT_SECRET is required}
      AGENT_CRM_CLIENT_SECRET: ${AGENT_CRM_CLIENT_SECRET:?AGENT_CRM_CLIENT_SECRET is required}
      AGENT_SUPPORT_CLIENT_SECRET: ${AGENT_SUPPORT_CLIENT_SECRET:?AGENT_SUPPORT_CLIENT_SECRET is required}
      AGENT_MARKETING_CONTENT_CLIENT_SECRET: ${AGENT_MARKETING_CONTENT_CLIENT_SECRET:?AGENT_MARKETING_CONTENT_CLIENT_SECRET is required}
      AGENT_MARKETING_VISUAL_CLIENT_SECRET: ${AGENT_MARKETING_VISUAL_CLIENT_SECRET:?AGENT_MARKETING_VISUAL_CLIENT_SECRET is required}
      AGENT_MARKETING_PUBLISHER_CLIENT_SECRET: ${AGENT_MARKETING_PUBLISHER_CLIENT_SECRET:?AGENT_MARKETING_PUBLISHER_CLIENT_SECRET is required}
    volumes:
      - ../keycloak/reconcile-production-realm.sh:/opt/opendx/reconcile-production-realm.sh:ro
    entrypoint: ["/bin/sh", "/opt/opendx/reconcile-production-realm.sh"]
    networks: [app]
    depends_on:
      keycloak: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    deploy: *tiny-deploy
    logging: *bounded-logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-opendx_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes: [opendx_minio:/data]
    networks: [data]
    restart: unless-stopped
    stop_grace_period: 30s
    deploy: *medium-deploy
    logging: *bounded-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    networks: [data]
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-opendx_minio} ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required};
        mc mb --ignore-existing local/${MINIO_BUCKET:-product-media};
        mc mb --ignore-existing local/${MINIO_SUPPORT_BUCKET:-support-attachments}
    restart: "no"
    deploy: *tiny-deploy
    logging: *bounded-logging

  clamav:
    image: clamav/clamav:1.5.3-debian13-slim@sha256:741e6c447241220e0792a901befcaec1d55a755c5097fc9cd88d7fd8be251a5c
    volumes: [opendx_clamav_signatures:/var/lib/clamav]
    networks: [data]
    restart: unless-stopped
    stop_grace_period: 30s
    deploy: *large-deploy
    logging: *bounded-logging
    healthcheck:
      test: ["CMD-SHELL", "bash -ec \"exec 3<>/dev/tcp/127.0.0.1/3310 && printf 'zPING\\0' >&3 && head -c 20 <&3 | grep -q PONG\""]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 2m

  migrate:
    build: { context: ../.., dockerfile: apps/api/Dockerfile, target: production }
    environment: *api-environment
    command: ["pnpm", "--filter", "@opendx/api", "db:migrate:all"]
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    deploy: *small-deploy
    logging: *bounded-logging

  seed:
    build: { context: ../.., dockerfile: apps/api/Dockerfile, target: production }
    environment: *api-environment
    command: ["pnpm", "--filter", "@opendx/api", "db:seed:all"]
    networks: [data]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-bootstrap: { condition: service_completed_successfully }
    restart: "no"
    deploy: *small-deploy
    logging: *bounded-logging

  api:
    build: { context: ../.., dockerfile: apps/api/Dockerfile, target: production }
    environment: *api-environment
    networks: [app, data, workflow, egress]
    depends_on:
      keycloak-reconcile: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
      seed: { condition: service_completed_successfully }
      ai-runtime: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 45s
    deploy: *medium-deploy
    logging: *bounded-logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 24

  ai-runtime:
    build: { context: ../.., dockerfile: services/ai-runtime/Dockerfile, target: production }
    environment: *ai-environment
    volumes: *client-tls-volumes
    networks: [app, workflow]
    group_add: ["${TEMPORAL_TLS_GROUP_ID:-20000}"]
    depends_on:
      temporal-namespace: { condition: service_completed_successfully }
      keycloak-reconcile: { condition: service_completed_successfully }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 45s
    deploy: *small-deploy
    logging: *bounded-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; raise SystemExit(0 if httpx.get('http://localhost:8000/ready').is_success else 1)"]
      interval: 10s
      timeout: 4s
      retries: 24

  ai-worker:
    build: { context: ../.., dockerfile: services/ai-runtime/Dockerfile, target: production }
    command: ["python", "-m", "app.agentic.worker"]
    environment:
      <<: *ai-environment
      ORCHESTRATION_DESCRIPTOR_EXECUTION_ENABLED: ${ORCHESTRATION_DESCRIPTOR_EXECUTION_ENABLED:-false}
      DEPARTMENT_TOOL_API_BASE_URL: http://api:4000/v1/internal/agentic
      AGENT_AI_CEO_CLIENT_ID: agent-ai-ceo
      AGENT_AI_CEO_CLIENT_SECRET: ${AGENT_AI_CEO_CLIENT_SECRET:?AGENT_AI_CEO_CLIENT_SECRET is required}
      AGENT_CATALOG_CLIENT_ID: agent-catalog
      AGENT_CATALOG_CLIENT_SECRET: ${AGENT_CATALOG_CLIENT_SECRET:?AGENT_CATALOG_CLIENT_SECRET is required}
      AGENT_INVENTORY_CLIENT_ID: agent-inventory
      AGENT_INVENTORY_CLIENT_SECRET: ${AGENT_INVENTORY_CLIENT_SECRET:?AGENT_INVENTORY_CLIENT_SECRET is required}
      AGENT_ORDER_CLIENT_ID: agent-order
      AGENT_ORDER_CLIENT_SECRET: ${AGENT_ORDER_CLIENT_SECRET:?AGENT_ORDER_CLIENT_SECRET is required}
      AGENT_FINANCE_CLIENT_ID: agent-finance
      AGENT_FINANCE_CLIENT_SECRET: ${AGENT_FINANCE_CLIENT_SECRET:?AGENT_FINANCE_CLIENT_SECRET is required}
      AGENT_CRM_CLIENT_ID: agent-crm
      AGENT_CRM_CLIENT_SECRET: ${AGENT_CRM_CLIENT_SECRET:?AGENT_CRM_CLIENT_SECRET is required}
      AGENT_SUPPORT_CLIENT_ID: agent-support
      AGENT_SUPPORT_CLIENT_SECRET: ${AGENT_SUPPORT_CLIENT_SECRET:?AGENT_SUPPORT_CLIENT_SECRET is required}
      AGENT_MARKETING_CONTENT_CLIENT_ID: agent-marketing-content
      AGENT_MARKETING_CONTENT_CLIENT_SECRET: ${AGENT_MARKETING_CONTENT_CLIENT_SECRET:?AGENT_MARKETING_CONTENT_CLIENT_SECRET is required}
      AGENT_MARKETING_VISUAL_CLIENT_ID: agent-marketing-visual
      AGENT_MARKETING_VISUAL_CLIENT_SECRET: ${AGENT_MARKETING_VISUAL_CLIENT_SECRET:?AGENT_MARKETING_VISUAL_CLIENT_SECRET is required}
      AGENT_MARKETING_PUBLISHER_CLIENT_ID: agent-marketing-publisher
      AGENT_MARKETING_PUBLISHER_CLIENT_SECRET: ${AGENT_MARKETING_PUBLISHER_CLIENT_SECRET:?AGENT_MARKETING_PUBLISHER_CLIENT_SECRET is required}
    volumes: *client-tls-volumes
    networks: [app, workflow]
    group_add: ["${TEMPORAL_TLS_GROUP_ID:-20000}"]
    depends_on:
      temporal-namespace: { condition: service_completed_successfully }
      ai-runtime: { condition: service_healthy }
      api: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 45s
    deploy: *small-deploy
    logging: *bounded-logging
    healthcheck:
      test: ["CMD", "python", "-m", "app.agentic.worker_healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6

  console:
    build:
      context: ../..
      dockerfile: apps/console/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.example.com}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-https://auth.example.com/realms/opendx}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-opendx-console}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-https://console.example.com/auth/callback}
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${VITE_OIDC_POST_LOGOUT_REDIRECT_URI:-https://console.example.com/sign-in}
    environment:
      PORT: "3000"
    networks: [app]
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    deploy: *small-deploy
    logging: *bounded-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 4s
      retries: 24

  storefront:
    build:
      context: ../..
      dockerfile: apps/storefront/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.example.com}
        VITE_STOREFRONT_ORIGIN: ${VITE_STOREFRONT_ORIGIN:-https://shop.example.com}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
    environment:
      PORT: "3100"
    networks: [app]
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    deploy: *small-deploy
    logging: *bounded-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100"]
      interval: 10s
      timeout: 4s
      retries: 24

volumes:
  caddy_data:
  caddy_config:
  opendx_postgres:
  opendx_minio:
  keycloak_data:
  opendx_clamav_signatures:

networks:
  edge:
  egress:
  app:
    internal: true
  data:
    internal: true
  workflow:
    internal: true
