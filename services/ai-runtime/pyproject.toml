[project]
name = "opendx-ai-runtime"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "uvicorn==0.52.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
