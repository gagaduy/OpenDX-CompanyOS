name: Security

on:
  pull_request:
  push:
    branches: [develop, phuong, main]

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: corepack enable
      - run: corepack prepare pnpm@11.18.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:env
      - run: pnpm audit:secrets
      - run: pnpm audit:repo
